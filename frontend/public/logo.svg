<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="saathiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C2410C" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="#FDFBF7" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#F3ECE1" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Sun Arc / Dawn Emblem -->
  <path d="M 120 320 A 136 136 0 0 1 392 320" fill="none" stroke="url(#saathiGrad)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Core Helping Hands / Guiding Light Motif -->
  <g filter="url(#shadow)">
    <!-- Central Sprout / Flame of Wisdom -->
    <path d="M 256 120 C 290 190 320 230 320 280 C 320 315 291 344 256 344 C 221 344 192 315 192 280 C 192 230 222 190 256 120 Z" fill="url(#saathiGrad)" />
    
    <!-- Growth Leaf Accent -->
    <path d="M 256 270 C 290 270 330 240 340 190 C 340 240 300 290 256 300 Z" fill="url(#leafGrad)" />
  </g>

  <!-- Ground / Solid Foundation Base -->
  <rect x="160" y="360" width="192" height="24" rx="12" fill="#1E293B" />
  <circle cx="256" cy="410" r="10" fill="#059669" />
</svg>
